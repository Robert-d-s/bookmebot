services:
  db:
    image: postgres:16-alpine
    container_name: bookmebot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookmebot
      POSTGRES_PASSWORD: bookmebot
      POSTGRES_DB: bookmebot
    # 5433 on the host so it does not clash with other local Postgres instances.
    ports:
      - "5433:5432"
    volumes:
      - bookmebot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmebot -d bookmebot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bookmebot-pgdata:
